<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://checkout.razorpay.com https://*.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.razorpay.com; connect-src 'self' https://*.workers.dev https://api.razorpay.com https://lumberjack.razorpay.com https://pawnote-api.pawnotekitty.workers.dev; frame-src https://api.razorpay.com https://checkout.razorpay.com; form-action 'self'; base-uri 'self'; object-src 'none'"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New design | Pawnote</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#7a5ce0">
<meta property="og:site_name" content="Pawnote"><meta property="og:image" content="assets/og-image.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- TEMPLATE FOR A NEW PRODUCT PAGE. Copy this file, rename it (for example birthday.html),
     then follow new-product-guide.txt. The checkout page needs no changes. -->
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main" class="wrap">

  <!-- 1. What the customer sees while making the gift -->
  <div class="page" id="make">
    <p class="eyebrow">New design</p>
    <h1 id="title">Your design name</h1>
    <div class="grid" style="grid-template-columns:minmax(0,1fr)"><div id="priceSlot"></div></div>
    <div class="panel" style="margin-top:18px">
      <div class="f"><label for="toName">Their first name</label><input id="toName" maxlength="30" placeholder="Anna"></div>
      <div class="f"><label for="msg">Your message</label><input id="msg" maxlength="200" placeholder="Write your words"></div>
      <button class="btn btn-primary" type="button" id="pay">Pay and get link</button>
      <p class="msg" id="note" role="status"></p>
    </div>
  </div>

  <!-- 2. What the other person sees when they open the link -->
  <div class="page" id="view" hidden>
    <p class="eyebrow">A gift for you</p>
    <h1 id="vTo"></h1>
    <p id="vMsg" style="font-size:1.3rem"></p>
  </div>
</main>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="site.js"></script>
<script src="checkout-start.js"></script>
<script src="product.js"></script>
</body>
</html>
